[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soteria"
version = "0.2.0"
description = "Soteria: a five-role agent team that decides on freight damage without any party learning more than it may"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.35.0,<2.0", "openai>=2.16.0,<3.0.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["soteria"]

[tool.flwr.app]
publisher = "flwrlabs"
display-name = "Soteria"
fab-format-version = 1
flwr-version-target = "1.35.0"
# Die Knoten laden ihre Daten aus data/ -- ohne diese Muster fehlen sie im FAB.
fab-include = [
  "soteria/**/*.py",
  "data/schema/*.json",
  "data/parties/*.json",
  "data/contracts/*.json",
  "data/network/*.json",
  "data/s*/*.json",
  "LICENSE",
]

# KEIN agentapp-Eintrag. flwr entscheidet in
# superlink/servicer/control/control_handlers.py:2159:
#   TaskType.AGENT_APP if "agentapp" in components else TaskType.SERVER_APP
# Mit agentapp wuerde die ServerApp also nie ausgefuehrt. Die Foederation ist
# ein ServerApp/ClientApp-Bundle; eine AgentApp waere ein eigenes Bundle.
[tool.flwr.app.components]
serverapp = "soteria.assessor_app:app"
clientapp = "soteria.party_app:app"

[tool.flwr.app.config]
case = "s1"
budget_seconds = 240

[tool.pytest.ini_options]
testpaths = ["tests"]
